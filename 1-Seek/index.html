<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Essaim de lucioles spatiales — Steering Behavior Seek avec p5.js">

    <title>🚀 Escadron Spatial — Seek Behavior</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="target.js"></script>
    <script src="targetFuyante.js"></script>
    <script src="population.js"></script>
    <script src="flee-scene.js"></script>
    <script src="starfield.js"></script>
    <script src="particles.js"></script>
    <script src="weapons.js"></script>
    <script src="interactive-audio.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <button id="ui-toggle" type="button" aria-controls="controls-panel" aria-expanded="false">⚙ Panneau</button>

    <aside id="controls-panel" class="controls" aria-label="Paramètres de l'escadron" hidden>
      <h1>🚀 Escadron Spatial</h1>
      <p class="subtitle">Steering Behavior — Seek & Flee (Craig Reynolds)</p>

      <!-- ── Mode cible ── -->
      <div class="control">
        <label for="target-mode">Mode cible</label>
        <select id="target-mode">
          <option value="mouse">🖱️ Suivre le curseur</option>
          <option value="autonomous">🌀 Portail autonome</option>
          <option value="flee">💨 Le portail fuit l'escadron</option>
        </select>
      </div>

      <!-- ── Fuite ── -->
      <fieldset class="section-group flee-controls">
        <legend>💨 Fuite du portail</legend>
        <div class="control">
          <label for="flee-detection-slider">Rayon de détection</label>
          <output id="flee-detection-value" for="flee-detection-slider">200 px</output>
          <input id="flee-detection-slider" type="range" min="50" max="500" step="10" value="200">
        </div>
        <div class="control">
          <label for="flee-exit-slider">Distance de sortie</label>
          <output id="flee-exit-value" for="flee-exit-slider">300 px</output>
          <input id="flee-exit-slider" type="range" min="100" max="800" step="10" value="300">
        </div>
        <div class="control">
          <label for="flee-duration-slider">Durée maximale</label>
          <output id="flee-duration-value" for="flee-duration-slider">2,0 s</output>
          <input id="flee-duration-slider" type="range" min="0.5" max="5" step="0.1" value="2">
        </div>
      </fieldset>

      <hr class="separator">

      <!-- ── Population de vaisseaux ── -->
      <div class="control">
        <label for="population-slider">🚀 Vaisseaux spatiaux</label>
        <output id="population-value" for="population-slider">20</output>
        <input id="population-slider" type="range" min="1" max="200" step="1" value="20">
      </div>

      <div class="control">
        <label for="speed-slider">Vitesse max</label>
        <output id="speed-value" for="speed-slider">4,0</output>
        <input id="speed-slider" type="range" min="0" max="40" step="0.1" value="4">
      </div>

      <div class="control">
        <label for="force-slider">Force max</label>
        <output id="force-value" for="force-slider">0,10</output>
        <input id="force-slider" type="range" min="0" max="10" step="0.01" value="0.1">
      </div>

      <div class="control">
        <label for="trail-slider">✨ Sillage ionique</label>
        <output id="trail-value" for="trail-slider">24</output>
        <input id="trail-slider" type="range" min="0" max="60" step="1" value="24">
      </div>

      <hr class="separator">

      <!-- ── Mode Debug IA ── -->
      <div class="control">
        <button id="debug-toggle" type="button" class="btn-secondary" aria-pressed="false">🔍 Mode Debug IA (Touche D)</button>
      </div>

      <!-- ── Prédateur ── -->
      <fieldset class="section-group">
        <legend>🦈 Vaisseau Prédateur</legend>
        <button id="predator-toggle" type="button" class="btn-danger" aria-pressed="false">🦈 Activer le prédateur</button>
        <p class="status-text">Un croiseur lourd traque vos chasseurs ! (Touche P)</p>
      </fieldset>

      <!-- ── Musique ── -->
      <fieldset class="section-group">
        <legend>🎵 Musique interactive</legend>
        <button id="music-toggle" type="button" class="btn-primary" aria-pressed="false">🎵 Activer la musique</button>
        <p id="music-status" class="status-text">X : FM et filtre · Y : hauteur</p>
        <div class="control">
          <label for="music-volume">Volume</label>
          <output id="music-volume-value" for="music-volume">25 %</output>
          <input id="music-volume" type="range" min="0" max="100" step="1" value="25">
        </div>
        <div class="control">
          <label for="music-tempo">Tempo</label>
          <output id="music-tempo-value" for="music-tempo">124 BPM</output>
          <input id="music-tempo" type="range" min="80" max="160" step="1" value="124">
        </div>
      </fieldset>

    </aside>
  </body>
</html>
