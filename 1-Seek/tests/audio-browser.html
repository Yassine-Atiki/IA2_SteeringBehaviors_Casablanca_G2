<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Validation Web Audio — Seek</title>
<script src="../interactive-audio.js"></script>
<h1>Validation du mix avec OfflineAudioContext</h1>
<button id="run">Exécuter les tests audio</button>
<pre id="results">En attente</pre>
<script>
  document.querySelector('#run').onclick = async () => {
    const output = document.querySelector('#results');
    output.textContent = 'Rendu en cours…';
    try {
      const messages = [];
      function check(condition, message) {
        if (!condition) throw new Error(message);
        messages.push(`PASS : ${message}`);
      }
      for (let cycle = 0; cycle < 2; cycle++) {
        const offline = new OfflineAudioContext(1, 48000, 48000);
        // Adaptateur : les sources et le graphe sont ceux de la vraie API.
        // Le rendu hors ligne pilote l'horloge, les timers sont déclenchés par le test.
        const timers = new Map();
        const cleanups = [];
        const context = new Proxy(offline, {
          get(target, key) {
            if (key === 'resume' || key === 'suspend') return () => Promise.resolve();
            const value = target[key];
            return typeof value === 'function' ? value.bind(target) : value;
          }
        });
        const engine = new InteractiveAudio.Engine({
          contextFactory: () => context,
          timers: {
            setInterval(callback) { timers.set(1, callback); return 1; },
            clearInterval(id) { timers.delete(id); },
            setTimeout(callback) { cleanups.push(callback); }
          }
        });
        await engine.start();
        const sourceCount = engine.sources.size;
        await engine.start();
        check(engine.sources.size === sourceCount && timers.size === 1, 'activation répétée sans duplication');
        for (const instrument of ['kick', 'snare', 'clap', 'bass']) engine.play({ instrument, note: 33 }, 0.25, 0.12);
        // Des sources futures doivent aussi être annulées par stop().
        engine.play({ instrument: 'kick' }, 0.8, 0.12);
        const paused = offline.suspend(0.5);
        const rendered = offline.startRendering();
        await paused;
        engine.nextMorph = context.currentTime;
        engine.updateMorph(context.currentTime);
        check(engine.morphCount === 1, 'morphing programmé avec de vrais AudioParam');
        engine.setPointer(1, 0);
        const stopping = engine.stop();
        check(!engine.running && timers.size === 0, 'séquenceur arrêté');
        await offline.resume();
        const buffer = await rendered;
        const samples = buffer.getChannelData(0);
        function rms(start, end) {
          let sum = 0;
          for (let i = start; i < end; i++) sum += samples[i] ** 2;
          return Math.sqrt(sum / (end - start));
        }
        const activeRms = rms(4800, 19200);
        const stoppedRms = rms(33600, 48000);
        check(activeRms > 0.001, `mix audible avant coupure (RMS ${activeRms.toFixed(6)})`);
        check(stoppedRms < 0.000001, `silence après coupure et notes futures annulées (RMS ${stoppedRms.toFixed(8)})`);
        for (const callback of cleanups) await callback();
        await stopping;
        check(engine.sources.size === 0 && engine.nodes.size === 0, 'sources et connexions libérées');
      }
      output.textContent = messages.join('\n') + '\nTOUS LES TESTS AUDIO PASSENT';
    } catch (error) { output.textContent = `ÉCHEC : ${error.stack}`; }
  };
</script>
</html>
