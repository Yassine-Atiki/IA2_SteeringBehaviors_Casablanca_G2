<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="libraries/webaudiox/jsfx/audio.js"></script>
    <script src="libraries/webaudiox/jsfx/jsfx.js"></script>
    <script src="libraries/webaudiox/jsfx/jsfxlib.js"></script>
    <script src="libraries/webaudiox/webaudiox.js"></script>
    <script src="pursue-scene.js"></script>
    <script src="vehicle.js"></script>
    <script src="target.js"></script>
    <script src="bouncingBall.js"></script>
    <script src="leurres.js"></script>
    <script src="audio.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <button id="ui-toggle" type="button" aria-expanded="false">UI on/off</button>
    <button id="audio-toggle" type="button" aria-pressed="false">Audio : off</button>
    <div id="population-status" aria-live="polite">
      Cibles restantes : <strong id="target-count-display">0</strong><br>
      Leurres actifs : <strong id="decoy-count-display">0</strong><br>
      Leurres disponibles : <strong id="decoy-budget-display">0</strong>
    </div>
    <section id="controls-panel" hidden aria-label="Réglages Pursue Evade">
      <h1>Pursue / Evade</h1>
      <label>Véhicules <output id="vehicle-count-value"></output><input id="vehicle-count" type="range" min="1" max="50" value="1"></label>
      <label>Cibles <output id="target-count-value"></output><input id="target-count" type="range" min="1" max="50" value="5"></label>
      <label>Mode de poursuite <select id="pursuit-mode"><option value="pursue">Pursue</option><option value="pursuePerfect">PursuePerfect</option></select></label>
      <label id="prediction-control">Prédiction <output id="prediction-value"></output><input id="prediction" type="range" min="0" max="60" step="0.5" value="20"></label>
      <label>Rayon de détection <output id="detection-value"></output><input id="detection" type="range" min="20" max="400" value="100"></label>
      <label>Vitesse véhicules <output id="vehicle-speed-value"></output><input id="vehicle-speed" type="range" min="0.1" max="30" step="0.1" value="10"></label>
      <label>Force véhicules <output id="vehicle-force-value"></output><input id="vehicle-force" type="range" min="0.01" max="2" step="0.01" value="0.25"></label>
      <label>Vitesse normale cibles <output id="target-speed-value"></output><input id="target-speed" type="range" min="0.1" max="15" step="0.1" value="5"></label>
      <label>Force normale cibles <output id="target-force-value"></output><input id="target-force" type="range" min="0.01" max="2" step="0.01" value="0.5"></label>
      <label>Vitesse en fuite <output id="evade-speed-value"></output><input id="evade-speed" type="range" min="0.1" max="25" step="0.1" value="12"></label>
      <label>Force en fuite <output id="evade-force-value"></output><input id="evade-force" type="range" min="0.01" max="3" step="0.01" value="1"></label>
      <label>Durée de vie des leurres <output id="decoy-lifetime-value"></output><input id="decoy-lifetime" type="range" min="0.2" max="5" step="0.1" value="1"></label>
      <label>Leurres par détection <output id="decoys-per-detection-value"></output><input id="decoys-per-detection" type="range" min="1" max="25" step="1" value="10"></label>
      <label>Délai entre deux largages <output id="decoy-cooldown-value"></output><input id="decoy-cooldown" type="range" min="0.5" max="10" step="0.5" value="3"></label>
      <label class="check"><input id="debug-toggle" type="checkbox"> Debug (touche D)</label>
    </section>
  </body>
</html>
