<!doctype html>
<meta charset="utf-8">
<title>Validation du signal audio</title>
<script src="../libraries/webaudiox/jsfx/audio.js"></script>
<script src="../libraries/webaudiox/jsfx/jsfx.js"></script>
<script src="../libraries/webaudiox/jsfx/jsfxlib.js"></script>
<script src="../libraries/webaudiox/webaudiox.js"></script>
<script src="../audio.js"></script>
<pre id="results">Tests en cours…</pre>
<script>
(async () => {
  const results = [];
  const rms = samples => Math.sqrt(samples.reduce((sum, value) => sum + value * value, 0) / samples.length);
  try {
    for (const [name, duration] of Object.entries({ explosion: 0.4, decoy: 0.2, decoyHit: 0.4, alarm: 0.5 })) {
      const context = new OfflineAudioContext(1, 44100, 44100);
      const engine = createPursueAudio({ context });
      engine.activate();
      engine.play(name);
      const data = (await context.startRendering()).getChannelData(0);
      const energy = rms(data.slice(0, duration * 44100));
      const tail = rms(data.slice((duration + 0.05) * 44100));
      if (energy < 0.001 || tail > 0.0001) throw new Error(`${name}: RMS=${energy}, tail=${tail}`);
      results.push(`${name}: PASS, durée ${duration} s, RMS ${energy.toFixed(4)}, silence après fin`);
    }
    const context = new OfflineAudioContext(1, 44100, 44100);
    const engine = createPursueAudio({ context });
    engine.activate();
    engine.play('explosion');
    const target = { maxSpeed: 10, vel: { mag: () => 5 } };
    engine.startFlee(target);
    engine.updateFlee(target);
    engine.toggle();
    const data = (await context.startRendering()).getChannelData(0);
    if (rms(data.slice(4410)) > 0.0001) throw new Error('audio off: signal non nul');
    results.push('Audio off: PASS, effets et fuite arrêtés');
    document.querySelector('#results').textContent = results.join('\n') + '\nALL PASS';
  } catch (error) {
    document.querySelector('#results').textContent = results.join('\n') + '\nFAIL: ' + error.stack;
  }
})();
</script>
